name: Supabase Keep Alive

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Edge Function
        run: |
          echo "Pinging Supabase Edge Function at $(date -u '+%Y-%m-%d %H:%M:%S UTC') (09:00 IST)..."
          
          response=$(curl -s -w "\n%{http_code}" \
            -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/ping" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n -1)
          
          if [ "$http_code" = "200" ]; then
            echo "✓ Edge Function ping successful (HTTP $http_code)"
            echo "Response: $body"
          else
            echo "✗ Edge Function ping failed (HTTP $http_code)"
            echo "Response: $body"
            exit 1
          fi
